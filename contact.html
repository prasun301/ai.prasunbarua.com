<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Prasun AI</title>

  <meta
    name="description"
    content="Contact Prasun AI for questions, feedback, suggestions or inquiries."
  >

  <!-- Google Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafd;
      color: #202124;
      line-height: 1.7;
    }

    /* =========================================
       HEADER
       ========================================= */

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 24px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      color: #111827;
      text-decoration: none;

      font-size: 21px;
      font-weight: 700;
    }

    /* EXACT SAME ICON USED ON MAIN PRASUN AI PAGE */

    .brand .material-symbols-outlined {
      color: #0b57d0;
      font-size: 32px;

      font-variation-settings:
        "FILL" 1,
        "wght" 500,
        "GRAD" 0,
        "opsz" 24;
    }

    nav a {
      color: #5f6368;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    nav a:hover {
      color: #0b57d0;
    }

    /* =========================================
       MAIN CONTENT
       ========================================= */

    main {
      max-width: 900px;
      margin: 45px auto;
      padding: 0 24px;
    }

    .content {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 42px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    h1 {
      font-size: 36px;
      margin: 0 0 10px;
    }

    .intro {
      color: #5f6368;
      font-size: 17px;
      margin: 0 0 32px;
    }

    /* =========================================
       CONTACT FORM
       ========================================= */

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      color: #202124;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid #dadce0;
      border-radius: 10px;
      padding: 13px 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      color: #202124;
      background: #fff;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .form-group input {
      height: 48px;
    }

    .form-group textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #0b57d0;
      box-shadow: 0 0 0 3px rgba(11, 87, 208, 0.12);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #9aa0a6;
    }

    /* =========================================
       SUBMIT BUTTON
       ========================================= */

    .submit-btn {
      width: fit-content;
      min-width: 130px;
      border: none;
      border-radius: 24px;
      padding: 12px 22px;

      background: #0b57d0;
      color: #fff;

      font-size: 14px;
      font-weight: 600;
      font-family: Arial, Helvetica, sans-serif;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }

    .submit-btn:hover {
      background: #0842a0;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* =========================================
       SUCCESS MESSAGE
       ========================================= */

    .success-message {
      display: none;
      margin-top: 20px;
      padding: 12px 15px;

      border: 1px solid #c6e7c9;
      border-radius: 10px;

      background: #f1f8f2;
      color: #237a35;

      font-size: 14px;
    }

    /* =========================================================
       PRASUN AI — SITE FOOTER
       ========================================================= */

    .site-footer {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 20px 18px;
      text-align: center;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 4px;
    }

    .footer-links a,
    .copyright a {
      color: #6b7280;
      text-decoration: none;
      transition:
        color 0.2s ease,
        opacity 0.2s ease;
    }

    .footer-links a:hover,
    .copyright a:hover {
      color: #0b57d0;
      text-decoration: underline;
    }

    .copyright {
      color: #6b7280;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 650px) {

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      nav a {
        margin-left: 0;
        margin-right: 14px;
      }

      .content {
        padding: 25px;
      }

      h1 {
        font-size: 29px;
      }

      .brand {
        font-size: 21px;
      }

      .brand .material-symbols-outlined {
        font-size: 30px;
      }

      .submit-btn {
        width: 100%;
      }
    }

    /* Mobile footer */

    @media (max-width: 600px) {
      .site-footer {
        padding: 12px 14px 16px;
        font-size: 11px;
      }

      .footer-links {
        gap: 5px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       HEADER
       ========================================= -->

  <header>

    <div class="header-inner">

      <a class="brand" href="index.html">

        <!-- EXACT SAME PRASUN AI ROBOT ICON -->
        <span
          class="material-symbols-outlined"
          aria-hidden="true"
        >smart_toy</span>

        <span>Prasun AI</span>

      </a>

      <nav>
        <a href="about.html">About</a>
        <a href="privacy-policy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html">Contact</a>
      </nav>

    </div>

  </header>


  <!-- =========================================
       MAIN
       ========================================= -->

  <main>

    <article class="content">

      <h1>Contact</h1>

      <p class="intro">
        Questions, feedback, suggestions or inquiries.
      </p>


      <!-- =====================================
           CONTACT FORM
           ===================================== -->

      <form
        class="contact-form"
        id="contactForm"
      >

        <!-- NAME -->

        <div class="form-group">

          <label for="name">
            Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            maxlength="100"
            autocomplete="name"
            required
          >

        </div>


        <!-- SUBJECT -->

        <div class="form-group">

          <label for="subject">
            Subject
          </label>

          <input
            type="text"
            id="subject"
            name="subject"
            placeholder="What would you like to contact us about?"
            maxlength="150"
            required
          >

        </div>


        <!-- MESSAGE -->

        <div class="form-group">

          <label for="message">
            Message
          </label>

          <textarea
            id="message"
            name="message"
            placeholder="Write your message..."
            maxlength="5000"
            required
          ></textarea>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="submit-btn"
        >
          Send Message
        </button>

      </form>


      <!-- SUCCESS MESSAGE -->

      <div
        class="success-message"
        id="successMessage"
        role="status"
      >
        Thank you for your message. Your submission has been received.
      </div>

    </article>

  </main>


  <!-- =========================================
       FOOTER
       ========================================= -->

  <footer class="site-footer">

    <div class="footer-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>

    <div class="copyright">
      © 2026 Prasun AI by
      <a
        href="https://www.prasunbarua.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        Prasun Barua
      </a>
      . All rights reserved.
    </div>

  </footer>


  <!-- =========================================
       CONTACT FORM JAVASCRIPT
       ========================================= -->

  <script>
    const contactForm = document.getElementById("contactForm");
    const successMessage = document.getElementById("successMessage");

    contactForm.addEventListener("submit", function (event) {
      event.preventDefault();

      successMessage.style.display = "block";

      contactForm.reset();

      successMessage.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    });
  </script>

</body>
</html>
