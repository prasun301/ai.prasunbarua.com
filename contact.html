  <meta
    name="description"
    content="Contact Prasun AI for questions, feedback, suggestions, or inquiries."

  <!-- Google Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafd;
      color: #202124;
      line-height: 1.7;
    }

    /* =========================================
       HEADER
       ========================================= */

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 24px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      color: #111827;
      text-decoration: none;

      font-size: 21px;
      font-weight: 700;
    }

    /* EXACT SAME ICON USED ON MAIN PRASUN AI PAGE */

    .brand .material-symbols-outlined {
      color: #0b57d0;
      font-size: 32px;

      font-variation-settings:
        "FILL" 1,
        "wght" 500,
        "GRAD" 0,
        "opsz" 24;
    }

    nav a {
      color: #5f6368;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    nav a:hover {
      color: #0b57d0;
    }

    /* =========================================
       MAIN CONTENT
       ========================================= */

    main {
      max-width: 900px;
      margin: 45px auto;
      padding: 0 24px;
    }

    .content {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 42px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    h1 {
      font-size: 36px;
      margin: 0 0 10px;
      color: #202124;
    }

    .intro {
      color: #5f6368;
      font-size: 17px;
      margin-top: 0;
      margin-bottom: 30px;
    }

    h2 {
      color: #0b57d0;
      margin-top: 35px;
      font-size: 21px;
    }

    p {
      color: #4b5563;
      font-size: 15px;
    }

    /* =========================================
       CONTACT FORM
       ========================================= */

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #202124;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;

      border: 1px solid #d1d5db;
      border-radius: 10px;

      background: #fff;
      color: #202124;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input:focus,
    textarea:focus {
      border-color: #0b57d0;
      box-shadow: 0 0 0 3px rgba(11, 87, 208, 0.10);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 12px 20px;

      border: none;
      border-radius: 10px;

      background: #0b57d0;
      color: #fff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }

    .submit-btn:hover {
      background: #0846a8;
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .form-status {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 500;
      min-height: 22px;
    }

    /* Honeypot */

    .honeypot {
      display: none !important;
    }

    /* =========================================
       FOOTER
       ========================================= */

    .site-footer {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 20px 18px;
      text-align: center;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 4px;
    }

    .footer-links a,
    .copyright a {
      color: #6b7280;
      text-decoration: none;

      transition:
        color 0.2s ease,
        opacity 0.2s ease;
    }

    .footer-links a:hover,
    .copyright a:hover {
      color: #0b57d0;
      text-decoration: underline;
    }

    .copyright {
      color: #6b7280;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 650px) {

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      nav a {
        margin-left: 0;
        margin-right: 14px;
      }

      main {
        margin: 30px auto;
      }

      .content {
        padding: 25px;
      }

      h1 {
        font-size: 29px;
      }

      .brand {
        font-size: 21px;
      }

      .brand .material-symbols-outlined {
        font-size: 30px;
      }
    }

    @media (max-width: 600px) {

      .site-footer {
        padding: 12px 14px 16px;
        font-size: 11px;
      }

      .footer-links {
        gap: 5px;
      }
    }
  </style>

<body>


  <!-- =========================================
       HEADER
       ========================================= -->

  <header>

    <div class="header-inner">

      <a class="brand" href="index.html">

        <!-- EXACT SAME PRASUN AI ROBOT ICON -->

        <span
          class="material-symbols-outlined"
          aria-hidden="true"
        >smart_toy</span>

        <span>Prasun AI</span>

      </a>


      <nav>

        <a href="about.html">About</a>

        <a href="privacy-policy.html">Privacy</a>

        <a href="terms.html">Terms</a>

        <a href="contact.html">Contact</a>

      </nav>

    </div>

  </header>



  <!-- =========================================
       MAIN
       ========================================= -->

  <main>

    <article class="content">

      <!-- ONLY TITLE — NO EXTRA ICON -->

      <h1>Contact</h1>

      <p class="intro">
        Questions, feedback, suggestions or inquiries.
      </p>


      <!-- =====================================
           CONTACT FORM
           ===================================== -->

      <form id="contactForm">

        <!-- Hidden Spam Protection Honeypot -->

        <input
          type="text"
          name="_gotcha"
          class="honeypot"
          tabindex="-1"
          autocomplete="off"
        >


        <!-- NAME -->

        <div class="form-group">

          <label for="name">
            Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            autocomplete="name"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- SUBJECT -->

        <div class="form-group">

          <label for="subject">
            Subject
          </label>

          <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Message subject"
            required
          >

        </div>


        <!-- MESSAGE -->

        <div class="form-group">

          <label for="message">
            Message
          </label>

          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Write your message here..."
            required
          ></textarea>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          id="submitBtn"
          class="submit-btn"
        >

          <span
            class="material-symbols-outlined"
            style="font-size: 18px;"
            aria-hidden="true"
          >send</span>

          <span>Send Message</span>

        </button>


        <p
          id="formStatus"
          class="form-status"
          aria-live="polite"
        ></p>

      </form>

    </article>

  </main>



  <!-- =========================================
       FOOTER
       ========================================= -->

  <footer class="site-footer">

    <div class="footer-links">

      <a href="privacy-policy.html">
        Privacy Policy
      </a>

      <a href="terms.html">
        Terms of Service
      </a>

      <a href="about.html">
        About
      </a>

      <a href="contact.html">
        Contact
      </a>

    </div>


    <div class="copyright">

      © 2026 Prasun AI by

      <a
        href="https://www.prasunbarua.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        Prasun Barua
      </a>

      . All rights reserved.

    </div>

  </footer>



  <!-- =========================================
       CONTACT FORM JAVASCRIPT
       ========================================= -->

  <script>

    document
      .getElementById('contactForm')
      .addEventListener('submit', async function(e) {

        e.preventDefault();


        const form = document.getElementById('contactForm');

        const btn = document.getElementById('submitBtn');

        const status = document.getElementById('formStatus');


        /* Honeypot spam check */

        const honeypot =
          form.querySelector('input[name="_gotcha"]').value;

        if (honeypot) {
          return;
        }


        btn.disabled = true;

        btn.querySelector('span:last-child').textContent =
          'Sending...';

        status.textContent = '';

        status.style.color = '';


        const payload = {

          name:
            document.getElementById('name').value.trim(),

          email:
            document.getElementById('email').value.trim(),

          siteName:
            'Prasun AI',

          message:
            `Subject: ${document.getElementById('subject').value.trim()}

${document.getElementById('message').value.trim()}`

        };


        try {

          const workerUrl =
            'https://multi-site-contact-backend.prasun301.workers.dev';


          const response = await fetch(
            workerUrl,
            {
              method: 'POST',

              headers: {
                'Content-Type': 'application/json'
              },

              body: JSON.stringify(payload)
            }
          );


          const result =
            await response.json();


          if (
            response.ok &&
            result.success
          ) {

            status.style.color = '#16a34a';

            status.textContent =
              '✓ Message sent successfully! We will get back to you soon.';

            form.reset();

          } else {

            throw new Error(
              result.error || 'Submission failed'
            );

          }


        } catch (err) {

          console.error(
            'Contact form error:',
            err
          );


          status.style.color = '#dc2626';

          status.textContent =
            '✕ Failed to send message. Please try again later.';

        } finally {

          btn.disabled = false;

          btn.querySelector('span:last-child').textContent =
            'Send Message';

        }

      });

  </script>


</body>

</html>
