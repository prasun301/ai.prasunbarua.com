<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Prasun AI — an intelligent AI assistant for learning, coding, writing, research and more."
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Prasun AI</title>

    <link
        rel="icon"
        href="favicon.ico"
    >

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/responsive.css"
    >
</head>


<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <span>
                    Prasun AI
                </span>

            </div>

            <button
                class="icon-button mobile-close"
                id="closeSidebar"
                aria-label="Close sidebar"
                title="Close sidebar"
            >
                ×
            </button>

        </div>


        <!-- New Chat -->

        <button
            class="new-chat-button"
            id="newChatButton"
            type="button"
        >

            <span class="new-chat-icon">
                ＋
            </span>

            <span>
                New chat
            </span>

        </button>


        <!-- Chat Search -->

        <div class="chat-search">

            <span
                class="search-icon"
                aria-hidden="true"
            >
                ⌕
            </span>

            <input
                type="search"
                id="chatSearch"
                placeholder="Search chats"
                autocomplete="off"
                aria-label="Search chats"
            >

            <span class="search-shortcut">
                ⌘ K
            </span>

        </div>


        <!-- Chat History -->

        <div class="history-container">

            <div class="history-section">

                <div class="history-title">
                    Today
                </div>

                <button
                    class="history-item active"
                    type="button"
                >
                    <span>
                        Welcome to Prasun AI
                    </span>
                </button>

            </div>


            <div class="history-section">

                <div class="history-title">
                    Yesterday
                </div>

                <button
                    class="history-item"
                    type="button"
                >
                    <span>
                        Solar energy discussion
                    </span>
                </button>

                <button
                    class="history-item"
                    type="button"
                >
                    <span>
                        Website development
                    </span>
                </button>

            </div>

        </div>


        <!-- Sidebar Bottom -->

        <div class="sidebar-bottom">

            <button
                class="sidebar-item"
                id="themeButton"
                type="button"
            >

                <span aria-hidden="true">
                    ☼
                </span>

                <span>
                    Appearance
                </span>

            </button>


            <button
                class="sidebar-item"
                id="settingsButton"
                type="button"
            >

                <span aria-hidden="true">
                    ⚙
                </span>

                <span>
                    Settings
                </span>

            </button>


            <div class="user-profile">

                <div class="user-avatar">
                    P
                </div>

                <div class="user-info">

                    <strong>
                        Prasun
                    </strong>

                    <span>
                        Free plan
                    </span>

                </div>

                <span class="profile-more">
                    ⋯
                </span>

            </div>

        </div>

    </aside>


    <!-- Mobile Sidebar Overlay -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">


        <!-- Topbar -->

        <header class="topbar">

            <button
                class="icon-button menu-button"
                id="openSidebar"
                type="button"
                aria-label="Open sidebar"
                title="Open sidebar"
            >
                ☰
            </button>


            <button
                class="model-selector"
                id="modelSelector"
                type="button"
                aria-label="AI model"
            >

                <span>
                    Prasun AI
                </span>

                <span class="model-badge">
                    AI
                </span>

                <span class="chevron">
                    ▾
                </span>

            </button>


            <div class="topbar-actions">

                <button
                    class="icon-button"
                    id="shareButton"
                    type="button"
                    aria-label="Share"
                    title="Share"
                >
                    ↗
                </button>

            </div>

        </header>


        <!-- =================================================
             CHAT AREA
             ================================================= -->

        <section
            class="chat-area"
            id="chatArea"
        >


            <!-- Welcome -->

            <div
                class="welcome-screen"
                id="welcomeScreen"
            >

                <div class="welcome-icon">
                    ✦
                </div>

                <h1>
                    How can I help you today?
                </h1>

                <p>
                    Ask Prasun AI anything.
                    Get help with learning,
                    coding, writing, research
                    and more.
                </p>


                <!-- Suggestions -->

                <div class="suggestions">


                    <button
                        class="suggestion-card"
                        type="button"
                        data-prompt="Explain how solar panels generate electricity."
                    >

                        <span class="suggestion-icon">
                            ⚡
                        </span>

                        <span>
                            Explain how solar panels generate electricity
                        </span>

                    </button>


                    <button
                        class="suggestion-card"
                        type="button"
                        data-prompt="Help me write a professional website."
                    >

                        <span class="suggestion-icon">
                            ◇
                        </span>

                        <span>
                            Help me write a professional website
                        </span>

                    </button>


                    <button
                        class="suggestion-card"
                        type="button"
                        data-prompt="Teach me JavaScript from beginner level."
                    >

                        <span class="suggestion-icon">
                            &lt;/&gt;
                        </span>

                        <span>
                            Teach me JavaScript from beginner level
                        </span>

                    </button>


                    <button
                        class="suggestion-card"
                        type="button"
                        data-prompt="Give me five interesting science facts."
                    >

                        <span class="suggestion-icon">
                            ✨
                        </span>

                        <span>
                            Give me five interesting science facts
                        </span>

                    </button>


                </div>

            </div>


            <!-- Messages -->

            <div
                class="messages"
                id="messages"
                aria-live="polite"
                aria-atomic="false"
            ></div>


        </section>


        <!-- =================================================
             COMPOSER
             ================================================= -->

        <div class="composer-wrapper">


            <!-- Attachment Preview -->

            <div
                class="attachment-preview"
                id="attachmentPreview"
                hidden
            >

                <div class="attachment-icon">
                    <span id="attachmentIcon">
                        📎
                    </span>
                </div>

                <div class="attachment-info">

                    <span id="attachmentName"></span>

                    <span id="attachmentSize"></span>

                </div>


                <button
                    class="remove-attachment"
                    id="removeAttachment"
                    type="button"
                    aria-label="Remove attachment"
                    title="Remove attachment"
                >
                    ×
                </button>

            </div>


            <!-- Hidden File Input -->

            <input
                type="file"
                id="fileInput"
                hidden
            >


            <!-- Composer -->

            <div class="composer">


                <!-- Attachment Button -->

                <div class="composer-toolbar">

                    <button
                        class="composer-tool"
                        id="attachButton"
                        type="button"
                        title="Attach file"
                        aria-label="Attach file"
                    >
                        ＋
                    </button>

                </div>


                <!-- Message Input -->

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Prasun AI..."
                    autocomplete="off"
                    spellcheck="true"
                    aria-label="Message Prasun AI"
                ></textarea>


                <!-- Composer Bottom -->

                <div class="composer-bottom">


                    <div class="composer-options">

                        <button
                            class="composer-option"
                            id="toolsButton"
                            type="button"
                            title="Tools"
                        >

                            <span>
                                ✨
                            </span>

                            <span>
                                Tools
                            </span>

                        </button>

                    </div>


                    <button
                        class="send-button"
                        id="sendButton"
                        type="button"
                        disabled
                        aria-label="Send message"
                        title="Send message"
                    >
                        ↑
                    </button>


                </div>

            </div>


            <!-- Disclaimer -->

            <div class="composer-disclaimer">
                Prasun AI can make mistakes.
                Check important information.
            </div>


        </div>

    </main>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script
    src="assets/js/app.js"
    defer
></script>

</body>

</html>
